<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc">
<title id="title">Miguel Cabral Vega</title>
<desc id="desc">Desarrollo web, sistemas y ciberseguridad. Cabecera con un circuito animado en tonos cian y verde.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e30"/><stop offset="1" stop-color="#080f1b"/></linearGradient>
  <linearGradient id="accent"><stop stop-color="#56e0c5"/><stop offset="1" stop-color="#77b9ff"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#7eacd6" stroke-opacity=".06"/></pattern>
  <style>
    .packet { animation: travel 8s linear infinite; }
    .cursor { animation: blink 1.4s steps(2,end) infinite; }
    @keyframes travel { from {stroke-dashoffset:400} to {stroke-dashoffset:0} }
    @keyframes blink { 50% {opacity:0} }
    @media (prefers-reduced-motion:reduce) { .packet,.cursor {animation:none} }
  </style>
</defs>
<rect width="1100" height="320" rx="20" fill="url(#bg)"/>
<rect width="1100" height="320" rx="20" fill="url(#grid)"/>
<g fill="none" stroke="#23445a" stroke-width="2">
  <path d="M760 0V63L820 123H1100M850 0V40L910 100H1100M720 320V270L810 180H1100M930 320V240L990 180"/>
</g>
<g class="packet" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="32 368">
  <path d="M760 0V63L820 123H1100"/>
  <path d="M720 320V270L810 180H1100"/>
</g>
<g fill="#56e0c5"><circle cx="820" cy="123" r="4"/><circle cx="810" cy="180" r="4"/></g>
<rect x="40" y="40" width="192" height="30" rx="15" fill="#142d37" stroke="#28524f"/>
<circle cx="57" cy="55" r="4" fill="#56e0c5"/>
<text x="71" y="60" fill="#9ee9d9" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.6">PUMCHEESE / GITHUB</text>
<text x="40" y="137" fill="#f0f6fc" font-family="Arial, sans-serif" font-weight="700" font-size="49" letter-spacing="-1.5">Miguel Cabral Vega</text>
<text x="42" y="178" fill="#b8c9dc" font-family="Arial, sans-serif" font-size="22">Desarrollo web · Sistemas · Ciberseguridad</text>
<text x="42" y="239" fill="#56e0c5" font-family="Consolas, monospace" font-size="18">&gt; aprender. construir. mejorar.</text>
<rect class="cursor" x="383" y="224" width="10" height="19" fill="#56e0c5"/>
<path d="M42 279H1058" stroke="#24394d"/>
<text x="42" y="301" fill="#91a7be" font-family="Arial, sans-serif" font-size="12" letter-spacing="1.4">CÁDIZ, ESPAÑA</text>
<text x="1058" y="301" text-anchor="end" fill="#91a7be" font-family="Consolas, monospace" font-size="12">code / learn / repeat</text>
</svg>